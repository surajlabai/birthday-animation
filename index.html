<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title> @surajprocreater Birthday Experience</title>
<meta name="theme-color" content="#050508" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   COLOR THEME
   ============================================================ */
:root {
  --bg-base: #050508;
  --card: rgba(10, 10, 15, 0.5);
  --card-hover: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(56, 189, 248, 0.4);
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.4);
  --primary: #10b981;
  --primary-glow: rgba(16, 185, 129, 0.4);
  --text-main: #38bdf8;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ============================================================
   BASE RESET & FONTS
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--bg-base);
  color: var(--accent);
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  perspective: 1000px;
}
.serif { font-family: 'Playfair Display', Georgia, serif; }
.text-sky { color: var(--accent) !important; text-shadow: 0 0 20px var(--accent-glow); }

/* ============================================================
   BACKGROUND CANVAS LAYERS
   ============================================================ */
.bg-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
  opacity: 0; transition: opacity 1.5s var(--ease);
}
.bg-canvas.active { opacity: 1; }

/* ============================================================
   CARDS & PANELS
   ============================================================ */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 56px 48px;
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow: 0 24px 48px -12px rgba(0,0,0,0.8), 0 0 50px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.05);
  border-color: rgba(16, 185, 129, 0.5);
  position: relative;
  width: 100%;
  max-width: 720px;
  z-index: 10;
  transform-style: preserve-3d;
  transition: transform 0.2s ease-out, box-shadow 0.3s var(--ease);
}
.panel::before, .panel::after {
  content: ''; position: absolute; width: 100px; height: 100px;
  border: 1px solid var(--primary); opacity: 0.7; border-radius: 24px;
  pointer-events: none; transition: all 0.4s var(--ease);
}
.panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

/* ============================================================
   INPUTS & BUTTONS
   ============================================================ */
.input-group { display: flex; flex-direction: column; gap: 24px; margin: 40px 0; }
input[type="text"], textarea {
  width: 100%; padding: 16px 20px;
  background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); border-radius: 12px;
  color: var(--accent); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; outline: none;
  transition: all 0.4s var(--ease);
}
input[type="text"] { text-align: center; }
input[type="text"]:focus, textarea:focus {
  border-color: var(--accent); background: rgba(56, 189, 248, 0.05); box-shadow: 0 0 0 4px var(--accent-glow);
}
textarea { resize: vertical; min-height: 80px; }

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100%; padding: 20px 32px;
  background: linear-gradient(135deg, var(--primary), #059669);
  color: #fff; border: none; border-radius: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700; letter-spacing: 0.05em;
  cursor: pointer; transition: all 0.4s var(--bounce);
  box-shadow: 0 10px 30px var(--primary-glow);
}
.btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.6); }
.btn-primary:active { transform: translateY(1px) scale(0.98); }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100%; padding: 20px 32px;
  background: transparent; color: var(--accent);
  border: 1px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all 0.4s var(--ease);
}
.btn-ghost:hover { background: var(--card-hover); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

/* ============================================================
   TYPOGRAPHY & AUTO-SCALING TEXT
   ============================================================ */
.heading-lg {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.6rem, 5vw, 4rem);
  font-weight: 600; line-height: 1.15; margin-bottom: 24px;
  color: var(--accent); text-shadow: 0 0 30px var(--accent-glow);
}

.wish-message {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.4rem, 3.5vw, 2.2rem);
  font-style: italic; line-height: 1.5;
  color: var(--accent); text-shadow: 0 0 20px var(--accent-glow);
  text-align: center; padding-bottom: 8px;
  transition: font-size 0.2s ease;
}
.wish-message .hindi {
  display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-style: normal;
  font-size: 0.85em; font-weight: 500; color: var(--accent); margin-top: 20px;
  line-height: 1.6; text-shadow: 0 0 15px var(--accent-glow);
}

.text-anim { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
.screen.on .text-anim { animation: textIn 1.2s var(--bounce) 0.2s forwards; }
@keyframes textIn { to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ============================================================
   SCREENS & PANEL ENTRY ANIMATION
   ============================================================ */
.stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 24px 32px; text-align: center;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.6s var(--ease), visibility 0.6s var(--ease);
}
.screen.on { opacity: 1; visibility: visible; pointer-events: auto; }
.screen.on .panel { animation: panelIn 0.8s var(--bounce) forwards; }
@keyframes panelIn { from { opacity: 0; transform: translateY(40px) scale(0.9) rotateX(10deg); } to { opacity: 1; transform: none; } }

/* ============================================================
   PLANT ANIMATIONS
   ============================================================ */
.plant-container { position: absolute; z-index: 2; pointer-events: none; width: 220px; height: 220px; opacity: 0.9; }
.plant-container.top-left { top: -50px; left: -50px; transform: rotate(-15deg); }
.plant-container.bottom-right { bottom: -50px; right: -50px; transform: rotate(165deg); }
.plant-container.center-bg { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; height: 350px; opacity: 0.15; }

@keyframes growVine { 0% { stroke-dashoffset: 200; opacity: 0; } 100% { stroke-dashoffset: 0; opacity: 1; } }
@keyframes bloomPetal { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 60% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

.plant-svg path.vine { stroke-dasharray: 200; stroke-dashoffset: 200; }
.screen.on .plant-svg path.vine { animation: growVine 2.5s var(--ease) forwards; }
.plant-svg .petal, .plant-svg .leaf { transform-origin: center; transform: scale(0); }
.screen.on .plant-svg .petal { animation: bloomPetal 1.8s var(--bounce) forwards; }
.screen.on .plant-svg .leaf { animation: bloomPetal 2s var(--ease) forwards; }
.screen.on .plant-svg .petal:nth-child(1) { animation-delay: 0.2s; }
.screen.on .plant-svg .petal:nth-child(2) { animation-delay: 0.4s; }
.screen.on .plant-svg .petal:nth-child(3) { animation-delay: 0.6s; }

/* ============================================================
   CAKE
   ============================================================ */
.cake { position: relative; display: flex; flex-direction: column; align-items: center; margin: 48px 0 32px; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.8)); }
.candles { display: flex; gap: 20px; margin-bottom: 4px; z-index: 3; }
.candle { position: relative; width: 6px; height: 40px; background: linear-gradient(180deg, var(--accent), #0ea5e9); border-radius: 2px; box-shadow: 0 0 15px var(--accent-glow); }
.flame {
  position: absolute; left: 50%; top: -20px; width: 14px; height: 24px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 50% 75%, var(--accent) 0%, #0ea5e9 40%, transparent 80%);
  box-shadow: 0 0 30px 6px var(--accent-glow); transform-origin: 50% 100%;
  animation: flick 0.4s ease-in-out infinite alternate; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
@keyframes flick { 0% { transform: translateX(-50%) scale(1) rotate(-3deg); opacity: 0.9; } 100% { transform: translateX(-50%) scale(1.1, 0.9) rotate(3deg); opacity: 1; } }
.flame.out { animation: none; opacity: 0; transform: translateX(-50%) scale(0.1); }
.tier { position: relative; width: 220px; height: 65px; margin-top: 3px; }
.tier.top { width: 130px; height: 55px; background: linear-gradient(145deg, rgba(56,189,248,0.15), rgba(56,189,248,0.05)); border: 1px solid var(--border-glow); border-radius: 8px 8px 2px 2px; backdrop-filter: blur(10px); }
.tier.mid { width: 180px; height: 50px; background: linear-gradient(145deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05)); border: 1px solid rgba(16,185,129,0.4); border-radius: 2px; }
.tier.bot { width: 240px; height: 60px; background: linear-gradient(145deg, rgba(0,0,0,0.6), rgba(0,0,0,0.9)); border: 1px solid var(--border); border-radius: 2px 2px 12px 12px; box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.2); }

/* ============================================================
   NAME DISPLAY
   ============================================================ */
.name-display { font-family: 'Playfair Display', serif; font-size: clamp(4rem, 14vw, 9rem); font-weight: 600; line-height: 1; display: flex; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.name-display .letter { display: inline-block; color: var(--accent); text-shadow: 0 0 40px var(--accent-glow); opacity: 0; filter: blur(12px); transform: translateY(30px) rotateX(-45deg); animation: letterIn 1.4s var(--bounce) forwards; }
@keyframes letterIn { to { opacity: 1; filter: blur(0); transform: none; } }

/* ============================================================
   MISC, TOAST, MODALS & CUSTOMIZER
   ============================================================ */
.sound-btn, .back-btn {
  position: fixed; top: 24px; width: 48px; height: 48px;
  border: 1px solid var(--border); background: var(--card);
  backdrop-filter: blur(10px); border-radius: 50%; font-size: 18px;
  cursor: pointer; display: grid; place-items: center; transition: all 0.3s var(--ease); z-index: 50;
}
.sound-btn { right: 24px; color: var(--primary); }
.sound-btn:hover { border-color: var(--primary); background: rgba(16,185,129,0.1); box-shadow: 0 0 20px var(--primary-glow); transform: scale(1.1); }
.back-btn { left: 24px; color: var(--accent); font-size: 22px; opacity: 0; pointer-events: none; }
.back-btn.visible { opacity: 1; pointer-events: auto; }
.back-btn:hover { border-color: var(--accent); background: rgba(56,189,248,0.1); box-shadow: 0 0 20px var(--accent-glow); transform: scale(1.1); }

.toast {
  position: fixed; left: 50%; bottom: 48px; z-index: 200; transform: translate(-50%, 24px);
  padding: 16px 32px; background: #0d1117; border: 1px solid var(--primary); border-radius: 12px;
  color: var(--primary); font-size: 14px; font-weight: 600;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 24px var(--primary-glow);
  opacity: 0; pointer-events: none; transition: all 0.4s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Persistent Profile */
.persistent-profile { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.6s var(--ease); }
.persistent-profile.visible { opacity: 1; }
.pp-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: rgba(56,189,248,0.08); display: grid; place-items: center; box-shadow: 0 0 24px var(--accent-glow), 0 0 0 2px var(--accent); position: relative; transition: transform 0.5s var(--bounce); transform: scale(0.6); }
.persistent-profile.visible .pp-inner { transform: scale(1); }
.pp-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-inner .ph-icon { width: 45%; height: 45%; color: var(--accent); opacity: 0.5; }

/* Creator Photo */
.photo-upload-row { display: flex; justify-content: center; }
.photo-preview-circle { width: 110px; height: 110px; border-radius: 50%; border: 2px dashed rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.05); overflow: hidden; cursor: pointer; position: relative; display: grid; place-items: center; transition: all 0.3s var(--ease); }
.photo-preview-circle:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); transform: scale(1.05); }
.photo-preview-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-placeholder { color: var(--accent); font-size: 22px; text-align: center; line-height: 1.2; pointer-events: none; }
.photo-placeholder small { font-size: 10px; opacity: 0.7; font-weight: 500; letter-spacing: 0.05em; }

/* Adjust Modal */
.adjust-overlay, .qr-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; visibility: hidden; transition: all 0.4s var(--ease); }
.adjust-overlay.show, .qr-overlay.show { opacity: 1; visibility: visible; }
.adjust-panel, .qr-panel { background: var(--card); border: 1px solid var(--border-glow); border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; align-items: center; box-shadow: 0 24px 48px rgba(0,0,0,0.8), 0 0 50px var(--accent-glow); backdrop-filter: blur(30px); }
.adjust-title, .qr-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
.adjust-hint { font-size: 12px; color: var(--accent); opacity: 0.7; margin-top: -10px; text-align: center; }
.adjust-circle-wrap { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); box-shadow: 0 0 30px var(--accent-glow); position: relative; touch-action: none; background: #0a0a0f; }
.adjust-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.adjust-canvas:active { cursor: grabbing; }
.zoom-slider { width: 100%; accent-color: var(--accent); height: 6px; cursor: pointer; }
.adjust-actions { display: flex; gap: 12px; width: 100%; }
.adjust-actions button { flex: 1; padding: 14px 20px; font-size: 14px; }

.adjust-dpad { display: grid; grid-template-columns: 42px 42px 42px; grid-template-rows: 42px 42px 42px; gap: 6px; place-items: center; }
.adjust-dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
.adjust-dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
.adjust-dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }
.adjust-dpad [data-dir="down"] { grid-column: 2; grid-row: 3; }
.arrow-btn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: rgba(56,189,248,0.05); color: var(--accent); font-size: 18px; cursor: pointer; display: grid; place-items: center; transition: all 0.18s var(--ease); }
.arrow-btn:hover { background: rgba(56,189,248,0.18); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

/* CUSTOMIZER SCREEN */
.customizer-list { width: 100%; max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 8px; margin-bottom: 20px; text-align: left; }
.customizer-list::-webkit-scrollbar { width: 6px; }
.customizer-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
.slide-item { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: all 0.3s ease; }
.slide-item.disabled { opacity: 0.5; }
.slide-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.slide-header h4 { color: var(--accent); font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
.toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(18px); }
.custom-inputs { display: flex; flex-direction: column; gap: 8px; }
.custom-inputs input { font-size: 14px; padding: 10px; }
.custom-inputs textarea { font-size: 14px; padding: 10px; min-height: 60px; }

/* QR Modal specific */
.qr-image { background: #fff; padding: 12px; border-radius: 12px; width: 250px; height: 250px; display: grid; place-items: center; overflow: hidden; }
.qr-image canvas, .qr-image img { max-width: 100%; max-height: 100%; object-fit: contain; }

@media (max-width: 480px) {
  .panel { padding: 32px 20px; }
  .name-display { font-size: 4rem; }
  .wish-message { font-size: 1.2rem; }
  .wish-message .hindi { font-size: 0.85em; margin-top: 12px; }
  .plant-container { width: 140px; height: 140px; }
  .adjust-circle-wrap { width: 180px; height: 180px; }
  .adjust-panel, .qr-panel { padding: 20px 16px; }
  .customizer-list { max-height: 40vh; }
}
</style>
</head>
<body>

<!-- Background (Only Hearts) -->
<canvas id="bg-heart" class="bg-canvas active"></canvas>

<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
<button class="back-btn" id="backBtn" aria-label="Go back">←</button>

<!-- Persistent Profile Circle -->
<div class="persistent-profile" id="persistentProfile">
  <div class="pp-inner" id="ppInner">
    <svg class="ph-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
  </div>
</div>

<main class="stage" id="stage">

  <!-- 0 · CREATOR -->
  <section class="screen on" id="creator">
    <div class="panel" id="creatorPanel">
      <h1 class="heading-lg text-anim">Make someone's day<br><span class="text-sky">unforgettable</span></h1>
      <form id="createForm" autocomplete="off" class="text-anim" style="animation-delay: 0.5s;">
        <div class="input-group">
          <div class="photo-upload-row">
            <div class="photo-preview-circle" id="photoPreviewCircle" title="Add a profile photo">
              <img id="photoPreviewImg" style="display:none;" alt="">
              <span id="photoPreviewPlaceholder" class="photo-placeholder">📷<br><small>Add Photo</small></span>
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none;">
          </div>
          <input id="nameInput" type="text" placeholder="Enter name... @srajproceater" maxlength="20" spellcheck="false" />
          <button type="submit" class="btn-primary">Create Magic ✨</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 0.5 · CUSTOMIZER -->
  <section class="screen" id="customizer">
    <div class="panel" style="max-width: 800px;">
      <h2 class="serif text-anim text-sky" style="font-size: 2rem; margin-bottom: 8px;">Customize Your Wish</h2>
      <p class="text-anim" style="font-size: 13px; color: var(--accent); opacity: 0.8; margin-bottom: 24px; animation-delay: 0.2s;">Select slides and edit the messages as you like.</p>
      
      <div class="customizer-list text-anim" id="customizerList" style="animation-delay: 0.3s;">
        <!-- Dynamically populated by JS -->
      </div>

      <button class="btn-primary text-anim" id="startExperienceBtn" style="animation-delay: 0.4s;">Start Experience 🚀</button>
    </div>
  </section>

  <!-- 1 · INTRO -->
  <section class="screen" id="step1">
    <div class="monogram-wrap text-anim" style="position:relative;width:140px;height:140px;display:grid;place-items:center;margin-bottom:48px;">
      <div style="position:absolute;inset:0;border:1px solid var(--border-glow);border-radius:50%;animation:spin 20s linear infinite;"></div>
      <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 16px var(--accent-glow));"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>
    </div>
    <h2 class="serif text-anim" style="font-size: 2.4rem; color: var(--accent); line-height: 1.4; text-shadow: 0 2px 20px var(--accent-glow); animation-delay: 0.3s;">Someone truly special<br>turns a year wiser today.</h2>
  </section>

  <!-- 2 · NAME -->
  <section class="screen" id="step2"><h1 class="name-display" id="nameBig"></h1></section>

  <!-- 3 · CAKE -->
  <section class="screen" id="step3">

/* ============================================================
   BACKGROUND ANIMATION (HEARTS)
   ============================================================ */
const bgCanvasIds = ['bg-heart'];
let bgAnimations = {};

bgAnimations['bg-heart'] = function() {
  const canvas = document.getElementById("bg-heart");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, animId;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); window.addEventListener("resize", resize);
  
  function drawHeart(cx, cy, s, fill, glow, blur = 12) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.shadowBlur = blur; ctx.shadowColor = glow; ctx.fillStyle = fill;
    ctx.beginPath(); const top = s * 0.3;
    ctx.moveTo(0, top);
    ctx.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, top);
    ctx.bezierCurveTo(-s * 0.5, (s + top) * 0.5, 0, (s + top) * 0.78, 0, s);
    ctx.bezierCurveTo(0, (s + top) * 0.78, s * 0.5, (s + top) * 0.5, s * 0.5, top);
    ctx.bezierCurveTo(s * 0.5, 0, 0, 0, 0, top);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  const COLORS = [
    "rgba(251,113,133,0.8)", "rgba(34,211,238,0.8)", "rgba(16,185,129,0.8)",
    "rgba(168,85,247,0.8)", "rgba(250,204,21,0.8)", "rgba(224,242,254,0.8)"
  ];

  let tick = 0, sparks = [];
  const runners = Array.from({ length: 50 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    s: rand(6, 14), vy: rand(0.4, 1.2), sway: Math.random() * 6.28, color: pick(COLORS)
  }));

  function loop() {
    tick++; ctx.clearRect(0, 0, W, H);
    runners.forEach(r => {
      r.y -= r.vy; r.sway += 0.025; const x = r.x + Math.sin(r.sway) * 16;
      if (r.y < -25) { r.y = H + 25; r.x = Math.random() * W; }
      if (tick % 3 === 0) sparks.push({ x, y: r.y + r.s, a: 0.85, color: r.color });
      drawHeart(x, r.y, r.s, r.color, r.color, 14);
    });
    sparks.forEach((sp, i) => {
      sp.y += 0.35; sp.a -= 0.024; if (sp.a <= 0) return sparks.splice(i, 1);
      const baseColor = sp.color.replace(/[^,]+(?=\))/, sp.a.toFixed(2));
      ctx.fillStyle = baseColor; ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.5, 0, Math.PI * 2); ctx.fill();
    });
    animId = requestAnimationFrame(loop);
  }
  loop();
  return () => cancelAnimationFrame(animId);
};

let bgCleanup = null;

/* ============================================================

   ============================================================ */
function adjustTextScale(el) {
  if (!el) return;
  const container = el.closest('.panel');
  if (!container) return;
  
  el.style.fontSize = ''; // Reset
  const maxPanelHeight = window.innerHeight * 0.7; 
  const textHeight = el.scrollHeight + 100;
  
  if (textHeight > maxPanelHeight) {
    let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
    const minSize = 12;
    
    while (el.scrollHeight + 100 > maxPanelHeight && currentSize > minSize) {
      currentSize -= 1;
      el.style.fontSize = currentSize + 'px';
    }
  }
}

/* ============================================================
   AUDIO SYSTEM
   ============================================================ */
let audioCtx = null, masterGain = null, isMuted = false;
let bgMusicInterval = null; let musicStep = 0;
const MELODY_NOTES = [261.63, 329.63, 392.00, 523.25, 220.00, 261.63, 329.63, 440.00, 174.61, 220.00, 261.63, 349.23, 196.00, 246.94, 293.66, 392.00];
const BASS_NOTES = [130.81, 110.00, 87.31, 98.00];

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC(); masterGain = audioCtx.createGain();
    masterGain.gain.value = isMuted ? 0 : 0.15;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!bgMusicInterval) startMusic();
}

function playTone(freq, time, duration, type = 'sine', vol = 0.5) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
  osc.type = type; osc.frequency.value = freq;
  filter.type = 'lowpass'; filter.frequency.value = 1200;
  gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(vol, time + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
  osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
  osc.start(time); osc.stop(time + duration + 0.1);
}

function startMusic() {
  if (musicStep !== 0) return;
  const scheduleNext = () => {
    if (!audioCtx || isMuted) return;
    const time = audioCtx.currentTime + 0.1;
    const noteFreq = MELODY_NOTES[musicStep % MELODY_NOTES.length];
    playTone(noteFreq, time, 1.5, 'sine', 0.2); 
    if (musicStep % 4 === 0) playTone(BASS_NOTES[Math.floor(musicStep / 4) % BASS_NOTES.length], time, 2.5, 'triangle', 0.15);
    if (musicStep % 8 === 4) playTone(noteFreq * 2, time + 0.1, 1.0, 'sine', 0.1);
    musicStep++;
    bgMusicInterval = setTimeout(scheduleNext, 350); 
  };
  scheduleNext();
}

function playChime() {
  if (!audioCtx || isMuted) return;
  const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  osc.connect(g); g.connect(masterGain); osc.start(); osc.stop(audioCtx.currentTime + 1.5);
}

document.addEventListener('click', ensureAudio, { once: true });
$('#soundBtn').addEventListener('click', (e) => {
  e.stopPropagation(); isMuted = !isMuted;
  if (masterGain) masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.15, audioCtx.currentTime, 0.1);
  $('#soundBtn').textContent = isMuted ? '🔇' : '🔊';
  if (!isMuted) ensureAudio();
});

const adjustState = { img: null, baseScale: 1, userScale: 1, offsetX: 0, offsetY: 0 };
const ADJUST_SIZE = 400;
const PROFILE_FALLBACK = `<svg class="ph-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>`;

function updatePersistentProfile(photoUrl) {
  const el = $('#ppInner'); if (!el) return;
  el.innerHTML = photoUrl ? `<img src="${photoUrl}" alt="Profile">` : PROFILE_FALLBACK;
}

function drawAdjustPreview() {
  const canvas = $('#adjustCanvas'); const ctx = canvas.getContext('2d');
  canvas.width = ADJUST_SIZE; canvas.height = ADJUST_SIZE;
  ctx.clearRect(0, 0, ADJUST_SIZE, ADJUST_SIZE); ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, ADJUST_SIZE, ADJUST_SIZE);
  const img = adjustState.img; if (!img) return;
  const scale = adjustState.baseScale * adjustState.userScale;
  const drawW = img.width * scale; const drawH = img.height * scale;
  const maxOffX = Math.max(0, (drawW - ADJUST_SIZE) / 2); const maxOffY = Math.max(0, (drawH - ADJUST_SIZE) / 2);
  adjustState.offsetX = Math.max(-maxOffX, Math.min(maxOffX, adjustState.offsetX));
  adjustState.offsetY = Math.max(-maxOffY, Math.min(maxOffY, adjustState.offsetY));
  const drawX = ADJUST_SIZE / 2 - drawW / 2 + adjustState.offsetX; const drawY = ADJUST_SIZE / 2 - drawH / 2 + adjustState.offsetY;
  ctx.save(); ctx.beginPath(); ctx.arc(ADJUST_SIZE / 2, ADJUST_SIZE / 2, ADJUST_SIZE / 2, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(img, drawX, drawY, drawW, drawH); ctx.restore();
}

$('#photoPreviewCircle').addEventListener('click', (e) => { e.stopPropagation(); $('#photoInput').click(); });
$('#photoInput').addEventListener('change', (e) => {
  e.stopPropagation(); const file = e.target.files && e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Please select an image.'); e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      adjustState.img = img; adjustState.baseScale = Math.max(ADJUST_SIZE / img.width, ADJUST_SIZE / img.height);
      adjustState.userScale = 1; adjustState.offsetX = 0; adjustState.offsetY = 0;
      $('#zoomSlider').value = 1; drawAdjustPreview(); $('#adjustModal').classList.add('show');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file); e.target.value = '';
});

(function() {
  const canvas = $('#adjustCanvas'); let dragging = false, startX, startY, startOffX, startOffY;
  canvas.addEventListener('pointerdown', (e) => {
    if (!adjustState.img) return; dragging = true; startX = e.clientX; startY = e.clientY; startOffX = adjustState.offsetX; startOffY = adjustState.offsetY;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return; const rect = canvas.getBoundingClientRect(); const sf = ADJUST_SIZE / rect.width;
    adjustState.offsetX = startOffX + (e.clientX - startX) * sf; adjustState.offsetY = startOffY + (e.clientY - startY) * sf; drawAdjustPreview(); e.preventDefault();
  });
  const endDrag = (e) => { if (!dragging) return; dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
})();

$('#zoomSlider').addEventListener('input', (e) => { adjustState.userScale = parseFloat(e.target.value); drawAdjustPreview(); });
document.querySelectorAll('.arrow-btn').forEach((btn) => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation(); if (!adjustState.img) return; const step = 10;
    if (btn.dataset.dir === 'left') adjustState.offsetX -= step; if (btn.dataset.dir === 'right') adjustState.offsetX += step;
    if (btn.dataset.dir === 'up') adjustState.offsetY -= step; if (btn.dataset.dir === 'down') adjustState.offsetY += step;
    drawAdjustPreview();
  });
});

$('#cancelAdjust').addEventListener('click', (e) => { e.stopPropagation(); $('#adjustModal').classList.remove('show'); });
$('#saveAdjust').addEventListener('click', (e) => {
  e.stopPropagation(); if (!adjustState.img) return;
  drawAdjustPreview(); const canvas = $('#adjustCanvas'); const dataUrl = canvas.toDataURL('image/png'); currentPhoto = dataUrl;
  const urlCanvas = document.createElement('canvas'); urlCanvas.width = 120; urlCanvas.height = 120;
  urlCanvas.getContext('2d').drawImage(canvas, 0, 0, 120, 120); shareablePhoto = urlCanvas.toDataURL('image/jpeg', 0.6);
  const previewImg = $('#photoPreviewImg'); previewImg.src = dataUrl; previewImg.style.display = 'block'; $('#photoPreviewPlaceholder').style.display = 'none';
  updatePersistentProfile(currentPhoto); $('#adjustModal').classList.remove('show');
});

/* ============================================================
   CUSTOMIZER LOGIC
   ============================================================ */
function renderCustomizer() {
  const list = $('#customizerList'); list.innerHTML = '';
  for (let i = 4; i <= 19; i++) {
    const isChecked = activeSlides.includes(i) ? 'checked' : '';
    const disabledClass = isChecked ? '' : 'disabled';
    const enText = customMessages[i] ? customMessages[i].en : slideData[i].en;
    const hiText = customMessages[i] ? customMessages[i].hi : slideData[i].hi;
    
    list.innerHTML += `
      <div class="slide-item ${disabledClass}" id="custom-item-${i}">
        <div class="slide-header">
          <h4>Slide ${i}</h4>
          <label class="toggle-switch">
            <input type="checkbox" data-id="${i}" ${isChecked} class="slide-toggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="custom-inputs">
          <textarea class="edit-en" data-id="${i}" placeholder="English Message">${enText.replace(/<[^>]*>/g, '')}</textarea>
          <input type="text" class="edit-hi" data-id="${i}" placeholder="Hindi Message" value="${hiText.replace(/<[^>]*>/g, '')}">
        </div>
      </div>
    `;
  }
}

$('#customizerList').addEventListener('change', (e) => {
  if (e.target.classList.contains('slide-toggle')) {
    const id = parseInt(e.target.dataset.id);
    const item = $(`#custom-item-${id}`);
    if (e.target.checked) {
      if (!activeSlides.includes(id)) activeSlides.push(id);
      item.classList.remove('disabled');
    } else {
      activeSlides = activeSlides.filter(s => s !== id);
      item.classList.add('disabled');
    }
  }
});

$('#customizerList').addEventListener('input', (e) => {
  const id = parseInt(e.target.dataset.id);
  if (e.target.classList.contains('edit-en')) {
    if (!customMessages[id]) customMessages[id] = { ...slideData[id] };
    customMessages[id].en = e.target.value;
  }
  if (e.target.classList.contains('edit-hi')) {
    if (!customMessages[id]) customMessages[id] = { ...slideData[id] };
    customMessages[id].hi = e.target.value;
  }
});

$('#startExperienceBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (activeSlides.length === 0) {
    toast('Please select at least one slide.');
    return;
  }
  
  activeSlides.sort((a, b) => a - b);
  
  // Apply messages to DOM
  for (let i = 4; i <= 19; i++) {
    if (activeSlides.includes(i)) {
      const msg = customMessages[i] || slideData[i];
      $(`#msg${i}`).innerHTML = `"${msg.en.replace(/<[^>]*>/g, '')}" <span class="hindi">"${msg.hi.replace(/<[^>]*>/g, '')}"</span>`;
    }
  }
  
  // Build the URL state
  const stateObj = {
    n: currentName,
    p: shareablePhoto,
    a: activeSlides,
    m: customMessages
  };
  const encodedData = encodeURIComponent(JSON.stringify(stateObj));
  history.replaceState(null, '', '?data=' + encodedData);

  $('#customizer').classList.remove('on');
  currentStepIndex = 0;
  setBackground();
  showScreen(activeSlides[0]);
  updateBackBtn();
  if (window.burstParticles) window.burstParticles(window.innerWidth/2, window.innerHeight/2, 100, 15);
});

/* ============================================================
   SLIDE CONTROLLER
   ============================================================ */
let currentStepIndex = -1;
let currentName = '';
let isTransitioning = false;
let isRecipient = false;

function showScreen(id) {
  $$('.screen').forEach((s) => s.classList.toggle('on', s.id === 'step' + id));
  const panel = document.querySelector(`#step${id} .panel`);
  if (panel) panel.style.transform = '';
  
  const pp = $('#persistentProfile');
  if (pp) pp.classList.toggle('visible', id !== 'creator' && id !== 'customizer');
  
  // Auto scale text
  setTimeout(() => {
    const msgEl = document.querySelector(`#step${id} .wish-message`);
    if (msgEl) adjustTextScale(msgEl);
  }, 100);
}

function revealName(name) {
  const el = $('#nameBig'); el.innerHTML = '';
  [...name].forEach((ch, i) => {
    const span = document.createElement('span'); span.className = 'letter'; span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.08) + 's'; el.appendChild(span);
  });
}

function blowCandles() {
  $$('.flame').forEach((f, i) => {
    const r = f.getBoundingClientRect();
    setTimeout(() => {
      f.classList.add('out');
      if (window.burstParticles) window.burstParticles(r.left + r.width / 2, r.top + r.height / 2, 30, 8);
    }, i * 100);
  });
}
function resetCandles() { $$('.flame').forEach((f) => f.classList.remove('out')); }

function updateBackBtn() {
  const btn = $('#backBtn'); if (!btn) return;
  btn.classList.toggle('visible', currentStepIndex > 0);
}

function goBack(e) {
  if (e) e.stopPropagation();
  if (isTransitioning) return;
  if (currentStepIndex <= 0) return;

  currentStepIndex--;
  const id = activeSlides[currentStepIndex];
  
  if (id === 3) resetCandles();
  if (id === 2) revealName(currentName);

  showScreen(id);
  playChime();
  updateBackBtn();
}
$('#backBtn').addEventListener('click', goBack);

function nextStep(e) {
  if (isTransitioning) return;
  if (e && e.target.closest('button, input, a')) return;
  if (currentStepIndex === -1) return;
  if (currentStepIndex >= activeSlides.length) return;
  if ($('#adjustModal').classList.contains('show') || $('#qrModal').classList.contains('show')) return;

  if (e && window.burstParticles) {
    const cx = e.clientX || window.innerWidth / 2; const cy = e.clientY || window.innerHeight / 2;
    window.burstParticles(cx, cy, 40, 10);
  }
  playChime();

  const currentId = activeSlides[currentStepIndex];
  if (currentId === 3) {
    blowCandles(); isTransitioning = true;
    setTimeout(() => { isTransitioning = false; advance(); }, 1500);
    return;
  }
  advance();
}

function advance() {
  currentStepIndex++;
  if (currentStepIndex < activeSlides.length) {
    const nextId = activeSlides[currentStepIndex];
    
    if (nextId === 2) {
      revealName(currentName); isTransitioning = true;
      setTimeout(() => isTransitioning = false, 2500);
    }
    
    showScreen(nextId);
    updateBackBtn();

    if (nextId === 20) {
      $('#finalName').textContent = currentName;
      setTimeout(() => {
        if (window.burstParticles) {
          window.burstParticles(window.innerWidth/2, window.innerHeight/2, 150, 18);
          setTimeout(() => window.burstParticles(window.innerWidth*0.2, window.innerHeight*0.4, 80, 12), 300);
          setTimeout(() => window.burstParticles(window.innerWidth*0.8, window.innerHeight*0.4, 80, 12), 600);
        }
      }, 500);
    }
  }
}

document.addEventListener('click', nextStep);

/* ============================================================
   SHARE & QR & RESET
   ============================================================ */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 3000);
}

async function shareWish() {
  const url = location.href; const title = 'A birthday wish for ' + currentName;
  if (navigator.share) { try { await navigator.share({ title, url }); return; } catch (_) {} }
  try { await navigator.clipboard.writeText(url); toast('Link copied! ✨'); } catch { window.prompt('Copy this link:', url); }
}
$('#shareBtn').addEventListener('click', (e) => { e.stopPropagation(); shareWish(); });

// New Local QR Code Generator
$('#qrBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const container = $('#qrContainer');
  container.innerHTML = ''; // Clear previous
  
  // Generate QR using the library
  new QRCode(container, {
    text: location.href,
    width: 250,
    height: 250,
    colorDark : "#000000",
    colorLight : "#ffffff",
    correctLevel : QRCode.CorrectLevel.L // Low error correction allows bigger text
  });
  
  $('#qrModal').classList.add('show');
});
$('#closeQrBtn').addEventListener('click', (e) => { e.stopPropagation(); $('#qrModal').classList.remove('show'); });
$('#qrModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) $('#qrModal').classList.remove('show'); });

$('#againBtn').addEventListener('click', (e) => {
  e.stopPropagation(); window.location.href = window.location.pathname;
});

/* ============================================================
   FORM SUBMISSION & BOOT
   ============================================================ */
$('#createForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#nameInput'); const name = input.value.replace(/[<>]/g, '').trim().slice(0, 20);
  if (!name) { input.style.borderColor = '#ef4444'; setTimeout(() => { input.style.borderColor = ''; }, 1500); return; }
  
  ensureAudio(); currentName = name;
  updatePersistentProfile(currentPhoto);
  
  // Move to Customizer
  $('#creator').classList.remove('on');
  $('#customizer').classList.add('on');
  renderCustomizer();
});

(function boot() {
  setBackground();
  updatePersistentProfile(null);

  const p = new URLSearchParams(location.search);
  const dataParam = p.get('data');

  if (dataParam) {
    // Recipient mode
    isRecipient = true;
    try {
      const state = JSON.parse(decodeURIComponent(dataParam));
      currentName = state.n || 'Friend';
      if (state.p) { currentPhoto = state.p; updatePersistentProfile(currentPhoto); }
      if (state.a && state.a.length > 0) activeSlides = state.a;
      if (state.m) customMessages = state.m;
      
      // Apply custom messages
      for (let i = 4; i <= 19; i++) {
        if (activeSlides.includes(i)) {
          const msg = customMessages[i] || slideData[i];
          $(`#msg${i}`).innerHTML = `"${msg.en.replace(/<[^>]*>/g, '')}" <span class="hindi">"${msg.hi.replace(/<[^>]*>/g, '')}"</span>`;
        }
      }

      // Configure Final Screen buttons for Recipient
      $('#finalActions').innerHTML = `
        <button class="btn-primary" id="againBtn" style="display: block;">Create Your Own ✨</button>
      `;
      // Rebind the new button
      $('#againBtn').addEventListener('click', (e) => { e.stopPropagation(); window.location.href = window.location.pathname; });

      $('#creator').classList.remove('on');
      currentStepIndex = 0;
      showScreen(activeSlides[0]);
      
    } catch (err) {
      console.error("Invalid data format", err);
      // Fallback to creator if URL is corrupted
    }
  }
})();
</script>
</body>
